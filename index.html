<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Creative Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 200px);
      grid-gap: 20px;
      text-align: center;
    }

    .grid-item {
      position: relative;
      width: 200px;
      height: 200px;
      background: #fff;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 15px;
      transition: transform 0.3s;
    }

    .grid-item:hover {
      transform: scale(1.05);
    }

    .text {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5em;
      font-weight: bold;
      background: #fff;
      z-index: 2;
      transition: transform 0.5s ease;
    }

    .image {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .grid-item:hover .text {
      transform: translateY(-100%);
    }

    .grid-item:hover .image {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="grid">
  <div class="grid-item">
    <div class="text">Modeling</div>
    <div class="image" style="background-image: url('modeling-preview.jpg');"></div>
  </div>
  <div class="grid-item">
    <div class="text">Acting</div>
    <div class="image" style="background-image: url('acting-preview.jpg');"></div>
  </div>
  <div class="grid-item">
    <div class="text">Brands</div>
    <div class="image" style="background-image: url('brands-preview.jpg');"></div>
  </div>
  <div class="grid-item">
    <div class="text">Media</div>
    <div class="image" style="background-image: url('media-preview.jpg');"></div>
  </div>
  <div class="grid-item">
    <div class="text">About Me</div>
    <div class="image" style="background-image: url('about-preview.jpg');"></div>
  </div>
</div>

</body>
</html>
